{{define "content"}}
<div class="card narrow">
  <div class="login-brand"><img src="/static/icon.svg" alt=""><h1>YTGuard</h1></div>
  <p class="muted">{{if .PCName}}<b>{{.PCName}}</b> · {{end}}Parent login. This is YTGuard's own account, not a computer account.</p>
  {{with .D.Error}}<div class="flash err">{{icon "alert"}}<div class="grow">{{.}}</div></div>{{end}}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{.D.Next}}">
    <label>Username <input name="username" autocomplete="username" required autofocus value="{{.D.Username}}"></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <label class="switch"><input type="checkbox" name="remember" checked> Remember this device <small class="muted">— rename or sign it out later under Security</small></label>
    <button class="primary">Log in</button>
  </form>
</div>
{{end}}
